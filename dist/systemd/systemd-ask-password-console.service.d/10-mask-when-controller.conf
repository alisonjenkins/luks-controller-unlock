; Drop-in: prevent the stock console password agent from racing our
; controller agent for the same /run/systemd/ask-password/ requests.
;
; Drop this in the initrd's
;   /usr/lib/systemd/system/systemd-ask-password-console.service.d/
; directory if you want to suppress the kernel-tty fallback prompt.
; Keyboard passphrase entry continues to work via systemd-cryptsetup
; reading our reply over the AF_UNIX socket — but this drop-in turns
; off the duplicate console prompt so the controller UI is the only
; thing on screen.
[Service]
ExecStart=
ExecStart=/bin/true
