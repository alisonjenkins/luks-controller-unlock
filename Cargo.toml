[package]
name = "luks-controller-unlock"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Unlock LUKS2 volumes with a game controller"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ali/luks-controller-unlock"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["luks", "cryptsetup", "controller", "gamepad", "initrd"]

[[bin]]
name = "luks-controller-unlock"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
evdev = "0.13"
drm = "0.14"
tiny-skia = "0.11"
fontdue = "0.9"
rustix = { version = "0.38", features = ["fs", "event", "termios", "process", "mount", "net", "system"] }
inotify = { version = "0.11", default-features = false }
libc = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.release-musl]
inherits = "release"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
